name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: mongodb+srv://${{ vars.MONGO_USER}}:${{ secrets.MONGO_PASS}}@supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: ${{ vars.MONGO_USER}}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASS}}

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v3
          with:
            node-version: 20
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test

        - name: Upload Test Results
          uses: actions/upload-artifact@v7
          with:
            name: test-results
            path: test-results.xml